<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#b47cff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Magic Kingdom English</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.svg">
<link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="screen-map" class="screen"></section>
  <section id="screen-castle" class="screen castle-screen-bg"></section>
  <section id="screen-game" class="screen game-screen-bg"></section>
  <section id="screen-reward" class="screen reward-screen-bg"></section>
  <section id="screen-treasure" class="screen treasure-screen-bg"></section>

  <div class="mascot-layer">
    <div class="mascot-wrap" id="mascot-wrap">
      <div class="speech-bubble" id="mascot-bubble"></div>
    </div>
  </div>
</div>
<canvas id="fx-canvas"></canvas>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
